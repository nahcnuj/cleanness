name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace and skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install (lockfile)
        run: npm ci

      - name: Structural checks
        run: npm test

      - name: Agent Skills spec (skills-ref)
        run: uvx --from skills-ref agentskills validate plugins/cleanness/skills/cleanness
